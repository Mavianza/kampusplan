[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kampusplan"
version = "1.0.0"
description = "CLI sederhana untuk mencatat dan memantau tenggat tugas kuliah."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daily Mini Apps" }]
dependencies = []

[project.scripts]
kampusplan = "kampusplan.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

